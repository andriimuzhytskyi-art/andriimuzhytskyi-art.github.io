
<!-- Tracker -->
<div class="value-tracker">
  <a href="/artist-and-experience-value-tracker.html" class="tracker">
    <span class="tracker-side tracker-left">
      <span class="tracker-value">0</span>
      <span class="tracker-label">€</span>
    </span>
    <span class="tracker-dot">·</span>
    <span class="tracker-side tracker-right">
      <span class="tracker-value">0</span>
      <span class="tracker-label">XP</span>
    </span>
  </a>
</div>

<!-- Tracker values -->
<script>
  function updateTrackerValues() {
    fetch("/data/journal.json")
      .then((response) => {
        if (!response.ok) {
          throw new Error(`HTTP error: ${response.status}`);
        }
        return response.json();
      })
      .then((data) => {
        const totalAmount = data.reduce((sum, item) => {
          if (item.amount == null) return sum;

          const numeric = Number(
            String(item.amount).replace(/[^\d.-]/g, "")
          );

          return sum + (Number.isFinite(numeric) ? numeric : 0);
        }, 0);

        const totalXP = data.reduce((sum, item) => {
          const xp = Number(item.xp);
          return sum + (Number.isFinite(xp) ? xp : 0);
        }, 0);

        const amountEl = document.querySelector(
          ".tracker-left .tracker-value"
        );
        const xpEl = document.querySelector(
          ".tracker-right .tracker-value"
        );

        if (!amountEl || !xpEl) return;

        amountEl.textContent = totalAmount.toLocaleString("de-DE");
        xpEl.textContent = totalXP;
      })
      .catch((error) =>
        console.error("Failed to load journal.json:", error)
      );
  }

  updateTrackerValues();
</script>
