<!-- Tracker value -->
<script>
  function updateTrackerValues() {
    fetch("data/journal.json")
      .then((response) => response.json())
      .then((data) => {
        const totalAmount = data.reduce((sum, item) => {
          if (!item.amount) return sum;
          const numeric = Number(String(item.amount).replace(/[^\d]/g, ""));
          return sum + (isNaN(numeric) ? 0 : numeric);
        }, 0);

        const totalXP = data.reduce((sum, item) => {
          const xp = Number(item.xp);
          return sum + (isNaN(xp) ? 0 : xp);
        }, 0);

        const amountEl = document.querySelector(".tracker-left .tracker-value");
        const xpEl = document.querySelector(".tracker-right .tracker-value");

        if (amountEl && xpEl) {
          amountEl.textContent = totalAmount.toLocaleString("de-DE");
          xpEl.textContent = totalXP;
          return true; // Успешно обновили
        }
        return false; // Элементы еще не подгружены
      })
      .catch((error) => console.error("Ошибка загрузки JSON:", error));
  }

  // Запускаем проверку каждые 100 мс, пока инклюд не появится в DOM
  const trackerInterval = setInterval(() => {
    const amountEl = document.querySelector(".tracker-left .tracker-value");
    if (amountEl) {
      updateTrackerValues();
      clearInterval(trackerInterval); // Останавливаем проверку, когда подгрузилось
    }
  }, 100);
</script>
